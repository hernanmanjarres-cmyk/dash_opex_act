name: Refresh Dashboard Data

on:
  schedule:
    # 7am, 10am, 1pm, 4pm COT (UTC-5) → 12, 15, 18, 21 UTC — lunes a viernes
    - cron: '0 12,15,18,21 * * 1-5'
  workflow_dispatch:  # permite dispararlo manualmente desde GitHub Actions

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generate_data.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: python3 generate_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "data: auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
